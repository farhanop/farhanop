name: Update README

on:
  schedule:
    # Runs every 12 hours to keep activity & stats fresh
    - cron: '0 */12 * * *'
  push:
    branches: [main]
    paths:
      - '.github/data/projects.json'
      - '.github/scripts/update.py'
      - '.github/workflows/update-readme.yml'
  repository_dispatch:
    types: [update-readme]
  workflow_dispatch:

concurrency:
  group: readme-update
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          GITHUB_TOKEN: ${{ secrets.README_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: farhanop
        run: python .github/scripts/update.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: sync featured projects, stats & activity [skip ci]"
            git push
          fi
