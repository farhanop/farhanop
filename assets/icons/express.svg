<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softPulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255,255,255,0.2)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
      }
      .anim-pulse { transform-origin: 32px 32px; animation: softPulse 2.4s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-pulse">
      <circle cx="32" cy="32" r="19" fill="#1e293b" stroke="#475569" stroke-width="1.2" />
      <text x="32" y="35.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#f8fafc" text-anchor="middle" letter-spacing="-0.3">express</text>
    </g>
  </g>
</svg>