<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <defs>
    <clipPath id="cardClip">
      <rect width="64" height="64" rx="14" />
    </clipPath>
    <style>
      @keyframes softFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      .anim-float { animation: softFloat 2.8s ease-in-out infinite; }
    </style>
  </defs>
  <g clip-path="url(#cardClip)">
    <rect width="64" height="64" rx="14" fill="#151d28" stroke="#334155" stroke-width="1.5" />
    <g class="anim-float">
      <g transform="translate(14, 14)">
        <rect x="0" y="0" width="16" height="16" rx="2" fill="#0078d4" />
        <rect x="19" y="0" width="16" height="16" rx="2" fill="#0078d4" />
        <rect x="0" y="19" width="16" height="16" rx="2" fill="#0078d4" />
        <rect x="19" y="19" width="16" height="16" rx="2" fill="#0078d4" />
        
        <g transform="translate(19, 19)">
          <circle cx="8" cy="8" r="7.5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
          <ellipse cx="8" cy="8" rx="4.5" ry="5.5" fill="#1e293b" />
          <ellipse cx="8" cy="9.2" rx="2.8" ry="3.8" fill="#f8fafc" />
          <polygon points="7,6.8 9,6.8 8,8.2" fill="#f59e0b" />
          <circle cx="6.8" cy="5.8" r="0.6" fill="#f8fafc" />
          <circle cx="9.2" cy="5.8" r="0.6" fill="#f8fafc" />
          <circle cx="6.8" cy="5.8" r="0.3" fill="#0f172a" />
          <circle cx="9.2" cy="5.8" r="0.3" fill="#0f172a" />
          <ellipse cx="6.2" cy="13.2" rx="1.5" ry="0.8" fill="#f59e0b" />
          <ellipse cx="9.8" cy="13.2" rx="1.5" ry="0.8" fill="#f59e0b" />
        </g>
      </g>
    </g>
  </g>
</svg>
