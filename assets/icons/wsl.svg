<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="48" height="48">
  <!-- Dark Squircle Background matching marwin1991 icons -->
  <rect width="64" height="64" rx="14" fill="#181e29" stroke="#334155" stroke-width="1.5" />
  
  <!-- Windows 11 Modern Quadrant -->
  <g transform="translate(13, 13)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="#00adef" />
    <rect x="19" y="0" width="16" height="16" rx="2" fill="#00adef" />
    <rect x="0" y="19" width="16" height="16" rx="2" fill="#00adef" />
    <rect x="19" y="19" width="16" height="16" rx="2" fill="#00adef" />
    
    <!-- Tux Penguin Overlay Badge in Bottom Right -->
    <g transform="translate(16, 14)">
      <!-- Tux Shadow / Border -->
      <ellipse cx="12" cy="14" rx="10" ry="11" fill="#0f172a" stroke="#f8fafc" stroke-width="1.2" />
      <!-- Tux Belly -->
      <ellipse cx="12" cy="15" rx="6" ry="7" fill="#f8fafc" />
      <!-- Tux Eyes -->
      <circle cx="10" cy="8" r="1.2" fill="#0f172a" />
      <circle cx="14" cy="8" r="1.2" fill="#0f172a" />
      <!-- Tux Beak -->
      <polygon points="11,10 13,10 12,12" fill="#f59e0b" />
      <!-- Tux Feet -->
      <ellipse cx="8" cy="23" rx="3" ry="1.5" fill="#f59e0b" />
      <ellipse cx="16" cy="23" rx="3" ry="1.5" fill="#f59e0b" />
    </g>
  </g>
</svg>
