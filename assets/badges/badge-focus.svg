<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 178 20" width="178" height="20">
  <defs>
    <linearGradient id="focusGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009688" />
      <stop offset="100%" stop-color="#00796b" />
    </linearGradient>
    <style>
      @keyframes boltPulse {
        0%, 100% { fill: #ffffff; transform: scale(1); }
        50% { fill: #2dd4bf; transform: scale(1.15); }
      }
      @keyframes orbitSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .bolt-icon {
        transform-origin: 12px 10px;
        animation: boltPulse 2s ease-in-out infinite;
      }
      .react-atom {
        transform-origin: 165px 10px;
        animation: orbitSpin 6s linear infinite;
      }
    </style>
  </defs>

  <rect width="178" height="20" rx="3" fill="#1e293b" />
  <rect x="52" width="126" height="20" rx="0 3 3 0" fill="url(#focusGrad)" />

  <!-- FastAPI Bolt -->
  <g class="bolt-icon">
    <polygon points="12,3 7,11 11,11 9,17 15,9 11,9" fill="#ffffff" />
  </g>

  <!-- Left Text -->
  <text x="21" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Focus</text>

  <!-- Right Text -->
  <text x="59" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff">FastAPI + React</text>

  <!-- Mini React Atom Orbit -->
  <g class="react-atom">
    <circle cx="165" cy="10" r="1.5" fill="#38bdf8" />
    <ellipse cx="165" cy="10" rx="4.5" ry="1.8" fill="none" stroke="#38bdf8" stroke-width="0.8" />
    <ellipse cx="165" cy="10" rx="4.5" ry="1.8" fill="none" stroke="#38bdf8" stroke-width="0.8" transform="rotate(60 165 10)" />
    <ellipse cx="165" cy="10" rx="4.5" ry="1.8" fill="none" stroke="#38bdf8" stroke-width="0.8" transform="rotate(120 165 10)" />
  </g>
</svg>
