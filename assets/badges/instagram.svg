<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 30" width="132" height="30">
  <defs>
    <clipPath id="btnClip">
      <rect width="132" height="30" rx="5" />
    </clipPath>
    <linearGradient id="instaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#833ab4" />
      <stop offset="50%" stop-color="#fd1d1d" />
      <stop offset="100%" stop-color="#fcb045" />
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes shimmerWave {
        0% { transform: translateX(-140px) skewX(-20deg); }
        35%, 100% { transform: translateX(160px) skewX(-20deg); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #fd1d1d; stroke-opacity: 0.4; }
        50% { stroke: #fbbf24; stroke-opacity: 1; filter: drop-shadow(0 0 4px rgba(251, 191, 36, 0.6)); }
      }
      .shimmer-bar {
        animation: shimmerWave 3.6s ease-in-out infinite 1.8s;
      }
      .btn-border {
        animation: pulseBorder 3s ease-in-out infinite 1.0s;
      }
    </style>
  </defs>

  <g clip-path="url(#btnClip)">
    <rect width="132" height="30" fill="url(#instaGrad)" />

    <!-- Moving Shimmer Highlight -->
    <rect x="0" y="-10" width="45" height="50" fill="url(#shimmerGrad)" class="shimmer-bar" />

    <!-- Instagram Camera Icon -->
    <g transform="translate(10, 7)">
      <rect x="0" y="0" width="16" height="16" rx="4.5" fill="none" stroke="#ffffff" stroke-width="1.8" />
      <circle cx="8" cy="8" r="3.6" fill="none" stroke="#ffffff" stroke-width="1.6" />
      <circle cx="12.2" cy="3.8" r="1" fill="#ffffff" />
    </g>

    <!-- Label -->
    <text x="35" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">INSTAGRAM</text>

    <!-- Pulsing Border -->
    <rect width="132" height="30" rx="5" fill="none" stroke="#fbbf24" stroke-width="1.2" class="btn-border" />
  </g>
</svg>
