<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 20" width="156" height="20">
  <defs>
    <style>
      @keyframes pinBounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-2px); }
      }
      .pin-icon {
        animation: pinBounce 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="156" height="20" rx="3" fill="#1e293b" />
  <rect x="68" width="88" height="20" rx="0 3 3 0" fill="#0f172a" />

  <!-- Location Pin Icon -->
  <g class="pin-icon" transform="translate(8, 3)">
    <path d="M 5 0 C 2.2 0 0 2.2 0 5 C 0 8.5 5 13 5 13 C 5 13 10 8.5 10 5 C 10 2.2 7.8 0 5 0 Z" fill="#ef4444" />
    <circle cx="5" cy="4.5" r="1.8" fill="#ffffff" />
  </g>

  <!-- Left Text -->
  <text x="22" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Location</text>

  <!-- Right Text -->
  <text x="75" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">Palembang, ID</text>
</svg>
