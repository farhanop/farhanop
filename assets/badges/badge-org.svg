<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 195 20" width="195" height="20">
  <defs>
    <linearGradient id="orgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <style>
      @keyframes pulseBeacon {
        0%, 100% { fill: #22c55e; opacity: 1; filter: drop-shadow(0 0 3px #22c55e); }
        50% { fill: #86efac; opacity: 0.4; filter: drop-shadow(0 0 0px #22c55e); }
      }
      .live-beacon {
        animation: pulseBeacon 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </defs>

  <rect width="195" height="20" rx="3" fill="#1e293b" />
