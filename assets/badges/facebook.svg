<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 30" width="128" height="30">
  <defs>
    <clipPath id="btnClip">
      <rect width="128" height="30" rx="5" />
    </clipPath>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes shimmerWave {
        0% { transform: translateX(-140px) skewX(-20deg); }
        35%, 100% { transform: translateX(150px) skewX(-20deg); }
      }
      @keyframes pulseBorder {
        0%, 100% { stroke: #1877f2; stroke-opacity: 0.4; }
        50% { stroke: #60a5fa; stroke-opacity: 1; filter: drop-shadow(0 0 4px rgba(96, 165, 250, 0.6)); }
      }
      .shimmer-bar {
        animation: shimmerWave 3.6s ease-in-out infinite 2.7s;
      }
      .btn-border {
        animation: pulseBorder 3s ease-in-out infinite 1.5s;
      }
    </style>
  </defs>

  <g clip-path="url(#btnClip)">
    <rect width="128" height="30" fill="#1877f2" />

    <!-- Moving Shimmer Highlight -->
    <rect x="0" y="-10" width="45" height="50" fill="url(#shimmerGrad)" class="shimmer-bar" />

    <!-- Facebook 'f' Icon -->
    <g transform="translate(10, 7)">
      <circle cx="8" cy="8" r="8" fill="#ffffff" />
      <path d="M 9.5 5.5 C 9 5.5 8.5 5.8 8.5 6.5 L 8.5 8 L 7 8 L 7 10 L 8.5 10 L 8.5 15 L 10.5 15 L 10.5 10 L 12.2 10 L 12.5 8 L 10.5 8 L 10.5 6.8 C 10.5 6.4 10.7 6.2 11.1 6.2 L 12.5 6.2 L 12.5 4.5 C 12 4.4 11.2 4.4 10.5 4.5" fill="#1877f2" />
    </g>

    <!-- Label -->
    <text x="35" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">FACEBOOK</text>

    <!-- Pulsing Border -->
    <rect width="128" height="30" rx="5" fill="none" stroke="#60a5fa" stroke-width="1.2" class="btn-border" />
  </g>
</svg>
