<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>

    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062822" />
      <stop offset="100%" stop-color="#071b18" />
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d3a" />
      <stop offset="100%" stop-color="#071326" />
    </linearGradient>

    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0d0d" />
      <stop offset="100%" stop-color="#180707" />
    </linearGradient>

    <linearGradient id="webrtcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="100%" stop-color="#120824" />
    </linearGradient>

    <linearGradient id="flowLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#009688" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowTeal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="flowGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.3" />
    </pattern>

    <!-- Arrowhead Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#009688" />
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#60a5fa" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#f87171" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#c084fc" />
    </marker>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { stroke-opacity: 0.5; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.4)); }
      }
      @keyframes pulseFastapi {
        0%, 100% { stroke-opacity: 0.6; }
        50% { stroke-opacity: 1; filter: drop-shadow(0 0 8px rgba(0, 150, 136, 0.6)); }
      }
      @keyframes packetClientToApi {
        0% { cx: 215; cy: 190; opacity: 0; }
        15% { opacity: 1; }
        85% { opacity: 1; }
        100% { cx: 335; cy: 190; opacity: 0; }
      }
      @keyframes packetApiToDb {
        0% { cx: 555; cy: 160; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 670; cy: 120; opacity: 0; }
      }
      @keyframes packetApiToRedis {
        0% { cx: 555; cy: 190; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 670; cy: 190; opacity: 0; }
      }
      @keyframes packetApiToRtc {
        0% { cx: 555; cy: 220; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 670; cy: 260; opacity: 0; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .flow-pipe {
        stroke-dasharray: 6 4;
        animation: dashFlow 2s linear infinite;
      }
      .flow-pipe-fast {
        stroke-dasharray: 6 4;
        animation: dashFlow 1.4s linear infinite;
      }
      .p-client-api { animation: packetClientToApi 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .p-api-db { animation: packetApiToDb 2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.2s; }
      .p-api-redis { animation: packetApiToRedis 1.7s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.5s; }
      .p-api-rtc { animation: packetApiToRtc 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.8s; }
      .node-fastapi { animation: pulseFastapi 3s ease-in-out infinite; }
      .cursor-blink { animation: blinkCursor 1s step-end infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="920" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="110" fill="#0284c7" opacity="0.12" filter="url(#ambientGlow)" />
  <circle cx="440" cy="190" r="130" fill="#009688" opacity="0.16" filter="url(#ambientGlow)" />
  <circle cx="760" cy="190" r="120" fill="#6366f1" opacity="0.12" filter="url(#ambientGlow)" />

  <!-- Flowchart Grid Lines -->
  <rect width="920" height="420" rx="16" fill="url(#flowGrid)" />

  <!-- Top Window Header Bar -->
  <rect x="25" y="16" width="870" height="34" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1" />
  <circle cx="45" cy="33" r="5" fill="#ef4444" />
  <circle cx="63" cy="33" r="5" fill="#f59e0b" />
  <circle cx="81" cy="33" r="5" fill="#10b981" />
  <text x="105" y="37" font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748b" font-weight="600">system-architecture-flowchart.svg — farhanop@fullstack-core</text>

  <!-- Live Status Badge -->
  <rect x="735" y="22" width="150" height="22" rx="6" fill="#032b26" stroke="#009688" stroke-width="0.8" />
  <circle cx="748" cy="33" r="3.5" fill="#10b981" />
  <text x="758" y="37" font-family="system-ui, sans-serif" font-size="10.5" fill="#34d399" font-weight="700">● REAL-TIME PIPELINE</text>

  <!-- Flowchart Subheader Legend -->
  <text x="35" y="74" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="700">HIGH-CONCURRENCY ARCHITECTURE FLOW</text>
  <text x="360" y="74" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">[CLIENT → REVERSE PROXY → FASTAPI ASYNC → PERSISTENCE &amp; STREAMING]</text>

  <!-- ==================== FLOWCHART CONNECTORS (BEHIND NODES) ==================== -->
  
  <!-- Connector 1: React Client -> FastAPI -->
  <path d="M 215 190 L 335 190" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 215 190 L 335 190" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-pipe-fast" marker-end="url(#arrowCyan)" />
  
  <!-- Connector 2A: FastAPI -> PostgreSQL -->
  <path d="M 555 160 C 600 160, 620 120, 670 120" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 555 160 C 600 160, 620 120, 670 120" fill="none" stroke="#60a5fa" stroke-width="2" class="flow-pipe" marker-end="url(#arrowBlue)" />

  <!-- Connector 2B: FastAPI -> Redis -->
  <path d="M 555 190 L 670 190" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 555 190 L 670 190" fill="none" stroke="#f87171" stroke-width="2" class="flow-pipe-fast" marker-end="url(#arrowRed)" />

  <!-- Connector 2C: FastAPI -> WebRTC Engine -->
  <path d="M 555 220 C 600 220, 620 260, 670 260" fill="none" stroke="#334155" stroke-width="2" />
  <path d="M 555 220 C 600 220, 620 260, 670 260" fill="none" stroke="#c084fc" stroke-width="2" class="flow-pipe" marker-end="url(#arrowPurple)" />

  <!-- Animated Moving Packets -->
  <circle cx="215" cy="190" r="4.5" fill="#38bdf8" filter="url(#glowCyan)" class="p-client-api" />
  <circle cx="555" cy="160" r="4.5" fill="#60a5fa" filter="url(#glowCyan)" class="p-api-db" />
  <circle cx="555" cy="190" r="4.5" fill="#f87171" class="p-api-redis" />
  <circle cx="555" cy="220" r="4.5" fill="#c084fc" class="p-api-rtc" />

  <!-- Protocol Badges over Connector Lines -->
  <rect x="235" y="174" width="76" height="18" rx="5" fill="#090d16" stroke="#0284c7" stroke-width="0.8" />
  <text x="273" y="187" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">REST / WS</text>

  <rect x="580" y="128" width="60" height="16" rx="4" fill="#090d16" stroke="#316192" stroke-width="0.8" />
  <text x="610" y="140" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#93c5fd" text-anchor="middle">Async SQL</text>

  <rect x="580" y="182" width="60" height="16" rx="4" fill="#090d16" stroke="#dc382d" stroke-width="0.8" />
  <text x="610" y="194" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#fca5a5" text-anchor="middle">Pub / Sub</text>

  <rect x="580" y="244" width="60" height="16" rx="4" fill="#090d16" stroke="#8b5cf6" stroke-width="0.8" />
  <text x="610" y="256" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#d8b4fe" text-anchor="middle">RTP Media</text>

  <!-- ==================== FLOWCHART NODES ==================== -->

  <!-- NODE 1: REACT CLIENT -->
  <g transform="translate(35, 115)">
    <rect width="180" height="150" rx="12" fill="url(#clientGrad)" stroke="#0284c7" stroke-width="1.4" />
    
    <!-- Header Pill -->
    <rect x="12" y="12" width="24" height="24" rx="6" fill="#0c4a6e" />
    <text x="18" y="29" font-family="system-ui, sans-serif" font-size="13">⚛</text>
    <text x="43" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">React Client UI</text>
    <rect x="125" y="14" width="45" height="18" rx="4" fill="#0369a1" />
    <text x="147" y="26" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CLIENT</text>

    <!-- Node Content -->
    <text x="14" y="58" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#38bdf8" font-weight="600">• React 18 + TypeScript</text>
    <text x="14" y="76" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Vite Build System</text>
    <text x="14" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• TanStack Server Query</text>
    <text x="14" y="112" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">• Tailwind CSS + Shadcn</text>

    <!-- Status Strip -->
    <rect x="0" y="130" width="180" height="20" rx="0 0 12 12" fill="#081020" />
    <circle cx="16" cy="140" r="3" fill="#38bdf8" />
    <text x="25" y="143" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748b">Type-Safe State Machine</text>
  </g>

  <!-- NODE 2: FASTAPI BACKEND (CENTRAL ENGINE) -->
  <g transform="translate(335, 95)">
    <rect width="220" height="190" rx="14" fill="url(#apiGrad)" stroke="#009688" stroke-width="1.8" class="node-fastapi" />

    <!-- Engine Header -->
    <rect x="14" y="14" width="28" height="28" rx="7" fill="#004d40" />
    <text x="23" y="33" font-family="system-ui, sans-serif" font-size="15">⚡</text>
    <text x="49" y="32" font-family="system-ui, sans-serif" font-size="14.5" font-weight="800" fill="#f8fafc">FastAPI Core</text>
    <rect x="156" y="16" width="50" height="20" rx="4" fill="#00796b" />
    <text x="181" y="30" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#ffffff" text-anchor="middle">ENGINE</text>

    <!-- Architecture Bullets -->
    <text x="16" y="65" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" font-weight="700">• Python 3.12 Asynchronous</text>
    <text x="16" y="85" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Pydantic V2 Strict Validation</text>
    <text x="16" y="103" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• JWT &amp; Role Middleware</text>
    <text x="16" y="121" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• Vertical Slice Architecture</text>
    <text x="16" y="139" font-family="'JetBrains Mono', monospace" font-size="10" fill="#cbd5e1">• WebRTC Media Signaling</text>

    <!-- Mini Code Box -->
    <rect x="12" y="152" width="196" height="26" rx="6" fill="#041412" stroke="#004d40" stroke-width="0.8" />
    <text x="20" y="169" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#2dd4bf">async def handler() -&gt; Response:</text>
    <rect x="185" y="160" width="1.5" height="10" fill="#2dd4bf" class="cursor-blink" />
  </g>

  <!-- NODE 3A: POSTGRESQL -->
  <g transform="translate(670, 85)">
    <rect width="215" height="68" rx="10" fill="url(#dbGrad)" stroke="#316192" stroke-width="1.2" />
    <rect x="10" y="10" width="22" height="22" rx="5" fill="#1e3a8a" />
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12">🗄️</text>
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">PostgreSQL Storage</text>
    <text x="10" y="46" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#93c5fd">• SQLAlchemy ORM + Alembic</text>
    <text x="10" y="59" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">• ACID Relational Persistence</text>
  </g>

  <!-- NODE 3B: REDIS CACHE & QUEUE -->
  <g transform="translate(670, 160)">
    <rect width="215" height="68" rx="10" fill="url(#redisGrad)" stroke="#dc382d" stroke-width="1.2" />
    <rect x="10" y="10" width="22" height="22" rx="5" fill="#7f1d1d" />
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12">⚡</text>
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">Redis In-Memory</text>
    <text x="10" y="46" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#fca5a5">• Pub/Sub Event Broker</text>
    <text x="10" y="59" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">• High-Speed Query Cache</text>
  </g>

  <!-- NODE 3C: WEBRTC MEDIA ENGINE -->
  <g transform="translate(670, 235)">
    <rect width="215" height="68" rx="10" fill="url(#webrtcGrad)" stroke="#8b5cf6" stroke-width="1.2" />
    <rect x="10" y="10" width="22" height="22" rx="5" fill="#4c1d95" />
    <text x="16" y="26" font-family="system-ui, sans-serif" font-size="12">📹</text>
    <text x="38" y="25" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#f8fafc">WebRTC Media Pipeline</text>
    <text x="10" y="46" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#d8b4fe">• Ultra-Low-Latency Video Feeds</text>
    <text x="10" y="59" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#64748b">• Campus Multi-Channel NVR</text>
  </g>

  <!-- ==================== BOTTOM INFRASTRUCTURE LAYER ==================== -->
  <g transform="translate(25, 325)">
    <!-- Container Bar -->
    <rect width="870" height="75" rx="10" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
    
    <!-- Title Tag -->
    <rect x="15" y="12" width="165" height="20" rx="5" fill="#0f2942" stroke="#2563eb" stroke-width="0.8" />
    <text x="24" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#60a5fa">🐳 INFRASTRUCTURE &amp; CI/CD</text>

    <!-- Subtitle Description -->
    <text x="195" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Containerized Environment • Automated Deployment Pipeline • Campus Production</text>

    <!-- Tech Pods along bottom -->
    <g transform="translate(15, 42)">
      <rect x="0" y="0" width="130" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Docker Compose</text>

      <rect x="140" y="0" width="120" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="150" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Nginx Gateway</text>

      <rect x="270" y="0" width="120" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="280" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Linux (WSL)</text>

      <rect x="400" y="0" width="145" height="22" rx="5" fill="#0f172a" stroke="#334155" stroke-width="0.8" />
      <text x="410" y="15" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">GitHub Actions CI</text>

      <rect x="555" y="0" width="285" height="22" rx="5" fill="#022c22" stroke="#009688" stroke-width="0.8" />
      <circle cx="568" cy="11" r="3" fill="#10b981" />
      <text x="578" y="15" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#34d399">Built for Universitas Indo Global Mandiri</text>
    </g>
  </g>
</svg>
