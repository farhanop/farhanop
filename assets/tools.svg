      <path d="M 26 36 C 32 36 31 32 31 32 L 28 32 C 28 32 28 34 25 34 C 22 34 22 32 22 30 L 22 28 L 30 28 C 34 28 36 26 36 22 C 36 18 33 16 29 16 L 27 16 L 27 19 C 27 23 25 24 21 24 L 19 24 C 17 24 15 26 15 28 L 15 32 C 15 36 20 36 26 36 Z" fill="#facc15" />
