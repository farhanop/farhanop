<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Card Base Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2f" />
      <stop offset="100%" stop-color="#0c1220" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Smooth Floating Wave Keyframes */
      @keyframes floatWave {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { stroke: #1e293b; stroke-width: 1.2; }
        50% { stroke: #38bdf8; stroke-width: 1.6; filter: drop-shadow(0 0 4px rgba(56, 189, 248, 0.4)); }
      }
      @keyframes fishWave {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(4deg) translateY(-2px); }
      }

      /* Card Floating Animation Classes with Staggered Delays */
      .card-c1 { animation: floatWave 3.2s ease-in-out infinite 0.0s; }
      .card-c2 { animation: floatWave 3.2s ease-in-out infinite 0.3s; }
      .card-c3 { animation: floatWave 3.2s ease-in-out infinite 0.6s; }
      .card-c4 { animation: floatWave 3.2s ease-in-out infinite 0.9s; }
      .card-c5 { animation: floatWave 3.2s ease-in-out infinite 1.2s; }
      .card-c6 { animation: floatWave 3.2s ease-in-out infinite 1.5s; }
      .card-c7 { animation: floatWave 3.2s ease-in-out infinite 1.8s; }
      .card-c8 { animation: floatWave 3.2s ease-in-out infinite 2.1s; }
      .card-c9 { animation: floatWave 3.2s ease-in-out infinite 2.4s; }

      .react-spin {
        transform-origin: 25px 25px;
        animation: spinOrbit 9s linear infinite;
      }
      .fish-tail {
        transform-origin: 25px 25px;
        animation: fishWave 2s ease-in-out infinite;
      }
      .card-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .tool-text {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #94a3b8;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="360" rx="14" fill="url(#gridBg)" stroke="#1e293b" stroke-width="1.2" />

  <!-- ==================== ROW 1 (Y = 22) ==================== -->

  <!-- 1. FastAPI -->
  <g transform="translate(25, 22)" class="card-c1">
    <rect width="78" height="66" rx="14" fill="url(#cardBg)" stroke="#009688" stroke-width="1.2" />
    <g transform="translate(14, 8)">
